name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: npm install -q pg
      - name: Apply schema
        run: |
          psql -h localhost -U postgres -d db -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d db -f sql/init.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d db -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d db -f sql/migrations/001_relax_constraints.sql
      - name: Run tests
        run: npm test